const MARK=/^(ważne|pamiętaj|uwaga|zapamiętaj|wniosek|definicja|przykład|notatka)$/i;
const DEFRE=/^(.{2,60}?)(?:\s+[–—-]\s+|:\s+|\s=\s)(.{8,})$/;

const EXR=/^(.{3,}?)\s*(?:::|=>)\s*(.{2,})$/;
const KR={kw:0,name:1,def:2,mark:3};
const ABBR=new Set('r w gen kpt mjr płk ppłk por ppor dr prof inż mgr ks ul al ok np tzw im św wg tys mln mld ang niem łac zob tj tzn godz nr pl pt woj min art ust pkt hr dyw bryg bat szt gr ww itd itp'.split(' '));
const sentSplit=t=>{const o=[];let st=0;const re=/[.!?]+\s+(?=[\p{Lu}„"(\d–-])/gu;let m;while(m=re.exec(t)){const b=t.slice(st,m.index+1).split(/\s+/).pop().replace(/[.!?]+$/,'').toLowerCase().replace(/^[„"(]/,'');if(m[0].trim()[0]=='.'&&(ABBR.has(b)||/^\p{L}$/u.test(b)))continue;o.push(t.slice(st,m.index+m[0].trim().length));st=m.index+m[0].length}o.push(t.slice(st));return o.map(x=>x.trim()).filter(Boolean)};
const DT=/(\d{4}|\d{1,2}\s+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)|(?:styczeń|luty|marzec|kwiecień|maj|czerwiec|lipiec|sierpień|wrzesień|październik|listopad|grudzień)\b)/i;
const hd0=t=>t.replace(/^\d+[.)]\s*/,'').replace(/[:\s]+$/,'');
const cut=(s,n)=>s.length<=n?s:s.slice(0,n).replace(/\s+\S*$/,'')+'…';
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const rtm=t=>new RegExp('(?<![\\p{L}\\d])'+reEsc(t)+'(?![\\p{L}\\d])','iu');
const YR=/(?<!\d)(1[0-9]{3}|20[0-9]{2})(?!\d)/;
const mc=(q,ans,dis,ex)=>{const o=shuf([ans,...dis.slice(0,3)]);return{q,opts:o,ans:o.indexOf(ans),ex:ex||''}};
const okd=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();return a!=b&&!a.includes(b)&&!b.includes(a)};
function gen(e){const r=norm(clean(e.h)),bl=blocks(r),defs=[],exc=[],lst=[],pool=new Map(),sents=[];
const add=(t,k)=>{t=String(t).trim().replace(/^[„"“(]+|[”".,;:!?]+$/g,'');if(!t.includes('('))t=t.replace(/\)+$/,'');if(t.length<3||t.length>45||MARK.test(t))return;const key=t.toLowerCase(),o=pool.get(key);if(!o||KR[k]>KR[o.k])pool.set(key,{t,k})};
r.querySelectorAll('b,strong,u,span[style*=background]').forEach(x=>add(x.textContent,'mark'));
bl.forEach((b,i)=>{
const x=b.t.match(EXR);if(x){exc.push({q:x[1].trim(),a:x[2].trim()});return}
if(b.h){let j=i+1;const it=[];while(j<bl.length&&bl[j].e.tagName=='LI'&&!bl[j].h){it.push(bl[j].t);j++}
if(it.length>=2)lst.push({q:'Wymień: '+hd0(b.t),a:it.map(v=>'• '+cut(v,120)).join('\n'),k:'Lista'});
else{const nx=bl[i+1];if(nx&&!nx.h)lst.push({q:hd0(b.t),a:cut(nx.t,260),k:'Temat'})}return}
let m=b.t.match(DEFRE),cop=0;
if(!(m&&m[1].trim().split(/\s+/).length<=6&&!/[.!?]$/.test(m[1])&&!MARK.test(m[1].trim()))){m=b.t.match(COP);cop=1;if(m&&(m[1].split(/\s+/).length>5||/[,;]/.test(m[1])||/^(to|ten|ta|co|który|która)\b/i.test(m[1])))m=null;if(m)m=[0,m[1],m[3]]}
if(m){defs.push({t:m[1].trim(),d:m[2].trim(),src:b.t,cop});add(m[1],'def')}
(b.t.length<=260?[b.t]:sentSplit(b.t)).forEach(s=>{if(s.length>=35&&s.length<=260)sents.push(s);s.split(/\s+/).forEach((w,k)=>{const c=w.replace(/[,.;:)"”]+$/,'');if(k>0&&/^\p{Lu}\p{L}{3,}$/u.test(c))add(c,'name')})})});
const st=kwStems(r);if(st.length)(r.textContent.match(new RegExp('(?<![\\p{L}\\d])(?:'+st.join('|')+')\\p{L}{1,}','giu'))||[]).forEach(w=>{if(w.length>=6)add(w.toLowerCase(),'kw')});
const all=[...pool.values()];
const dist=o=>[...shuf(all.filter(x=>x.k==o.k&&okd(x.t,o.t))),...shuf(all.filter(x=>x.k!=o.k&&x.k!='kw'&&okd(x.t,o.t))),...shuf(all.filter(x=>x.k=='kw'&&okd(x.t,o.t)))].slice(0,3).map(x=>x.t);
const cards=[...exc.map(c=>({q:c.q,a:c.a,k:'Własna'})),...lst,...defs.map(d=>({q:d.cop?'Co to jest „'+d.t+'”?':DT.test(d.t)?'Co wiesz o: '+d.t+'?':d.t,a:d.d,k:DT.test(d.t)?'Wydarzenie':'Pojęcie'}))],quiz=[];
let n=0;
shuf(sents).forEach(s=>{if(n>=26)return;const yr=s.match(YR);
const terms=all.filter(o=>o.k!='kw'&&!defs.some(d=>d.t.toLowerCase()==o.t.toLowerCase()&&s.toLowerCase().startsWith(o.t.toLowerCase()))).sort((a,b)=>KR[b.k]-KR[a.k]||b.t.length-a.t.length);
const t=terms.find(o=>rtm(o.t).test(s));
if(yr&&(!t||Math.random()<.5)){const y=+yr[1],o=new Set([y]);let g=0;while(o.size<4&&g++<40)o.add(y+(Math.random()<.5?-1:1)*(1+(Math.random()*20|0)));const q=s.replace(yr[1],'_____');cards.push({q,a:yr[1],k:'Data'});quiz.push(mc('Uzupełnij zdanie: '+q,yr[1],[...o].filter(v=>v!=y).map(String),'Pełne zdanie: '+s));n++;return}
if(t){const q=s.replace(rtm(t.t),'_____'),d=dist(t).filter(x=>!rtm(x).test(s));if(d.length>=2&&!(q.trim().startsWith('_____')&&q.length<50)){cards.push({q,a:t.t,k:'Luka'});quiz.push(mc('Uzupełnij zdanie: '+q,t.t,d,'Pełne zdanie: '+s));n++}}});
if(n<4)shuf(sents).forEach(s=>{if(n>=8)return;const t=all.find(o=>o.k=='kw'&&rtm(o.t).test(s));if(!t)return;const d=dist(t).filter(x=>!rtm(x).test(s));if(d.length<2)return;const q=s.replace(rtm(t.t),'_____');cards.push({q,a:t.t,k:'Luka'});quiz.push(mc('Uzupełnij zdanie: '+q,t.t,d,'Pełne zdanie: '+s));n++});
if(defs.length>=2)defs.forEach(d=>{const o=shuf(defs.filter(x=>x!==d&&okd(x.t,d.t)));if(!o.length)return;
quiz.push(mc(DT.test(d.t)?'Który opis pasuje do: „'+d.t+'”?':'Które wyjaśnienie pasuje do pojęcia „'+d.t+'”?',cut(d.d,120),o.slice(0,3).map(x=>cut(x.d,120)),d.src));
if(o.length>=2)quiz.push(mc(DT.test(d.t)?'Którego wydarzenia dotyczy opis?\n„'+cut(d.d,110)+'”':'„'+cut(d.d,110)+'” – to wyjaśnienie pojęcia:',d.t,o.slice(0,3).map(x=>x.t),d.src));
if(Math.random()<.5)quiz.push({q:'Prawda czy fałsz?\n„'+d.t+' – '+cut(d.d,100)+'”',opts:['Prawda','Fałsz'],ans:0,ex:'Zgadza się: '+d.src});
else quiz.push({q:'Prawda czy fałsz?\n„'+d.t+' – '+cut(o[0].d,100)+'”',opts:['Prawda','Fałsz'],ans:1,ex:'Poprawnie: '+d.t+' – '+cut(d.d,160)})});
if(exc.length>=3)exc.forEach(c=>{const o=shuf(exc.filter(x=>x!==c&&okd(x.a,c.a))).slice(0,3).map(x=>cut(x.a,120));if(o.length)quiz.push(mc(c.q,cut(c.a,120),o,''))});
const sc=new Set(),uc=cards.filter(c=>c.q&&c.a&&!sc.has(c.q)&&sc.add(c.q)).slice(0,70).map((c,i)=>({...c,id:i}));
const sq=new Set(),uq=quiz.filter(q=>q.opts.length>=2&&q.ans>=0&&!sq.has(q.q)&&sq.add(q.q));
