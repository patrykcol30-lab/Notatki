<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Notatki+</title>
<style>
:root{--tx:#f4f6ff;--mu:#b4bbdc;--bg:#0b0d1f;--sf:#191c3a;--gb:rgba(255,255,255,.2);--ac:#7c8cff;--r:24px}
:root[data-theme=light]{--tx:#16182e;--mu:#4d5378;--bg:#e8ecff;--sf:#f6f8ff;--gb:rgba(255,255,255,.9)}
[data-bg=aurora]{--b1:#6d5dfc;--b2:#19d3da;--b3:#ff6bd6}[data-bg=sunset]{--b1:#ff7a45;--b2:#ff3d81;--b3:#ffd166}[data-bg=ocean]{--b1:#0077ff;--b2:#00d4ff;--b3:#4b6cff}[data-bg=forest]{--b1:#1db954;--b2:#0fb5a0;--b3:#a3e635}[data-bg=mono]{--b1:#8890a8;--b2:#c9ceea;--b3:#5a607a}
[data-ft=serif] body{font-family:Georgia,serif}[data-ft=mono] body{font-family:ui-monospace,Menlo,monospace}[data-ft=round] body{font-family:ui-rounded,'Trebuchet MS',sans-serif}
[data-an="0"] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60% 50% at 10% 5%,color-mix(in srgb,var(--b1) 55%,transparent),transparent),radial-gradient(60% 50% at 95% 95%,color-mix(in srgb,var(--b2) 50%,transparent),transparent)}
.bg i{position:absolute;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--b3) 42%,transparent),transparent 65%);will-change:transform;animation:dr 22s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate3d(12vw,8vh,0) scale(1.25)}}@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
.i{width:20px;height:20px;flex:none}.i.f{fill:currentColor}
.g{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));border:1px solid var(--gb);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.16)}
:root[data-theme=light] .g{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.4))}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(28px,6vw,44px);background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 6s linear infinite}@keyframes shn{to{background-position:-200% 0}}
.sub{color:var(--mu);margin:4px 0 0;font-size:14px}
.btn,.chip{font:inherit;color:var(--tx);cursor:pointer;border:1px solid var(--gb);background:rgba(255,255,255,.12);border-radius:999px;padding:9px 15px;transition:transform .15s,background .15s;overflow:hidden;display:inline-flex;align-items:center;gap:7px}
.btn:not(.fab),.chip{position:relative}.btn:active,.chip:active{transform:scale(.95)}.pr,.chip.on{background:var(--ac);color:#fff;border-color:transparent}.dg{color:#ff6b7f}
.ib{padding:0;width:42px;height:42px;justify-content:center}
.chips,.row{display:flex;gap:8px;flex-wrap:wrap}.row{justify-content:flex-end;margin-top:12px}
.sr{position:relative;margin-bottom:10px}.sr .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu)}.sr input{padding-left:42px;margin:0}
.in .ev,.in header{animation:up .45s both}.in .ev:nth-child(2){animation-delay:.05s}.in .ev:nth-child(3){animation-delay:.1s}.in .ev:nth-child(4){animation-delay:.15s}.in .ev:nth-child(n+5){animation-delay:.2s}
.mt{color:var(--mu);font-size:13px}
.ev{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;border-left:4px solid var(--c);cursor:pointer;transition:transform .2s,box-shadow .2s}.ev:hover{transform:translateX(6px);box-shadow:0 10px 26px rgba(0,0,0,.28)}.ev.past{opacity:.55}.ev h3{margin:3px 0;display:flex;align-items:center;gap:6px}
.ev .ic{width:50px;height:50px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--c) 28%,transparent);color:var(--c);flex:none}.ev .ic .i{width:26px;height:26px}
.m{position:fixed;inset:0;z-index:50;background:rgba(5,6,20,.6);display:grid;place-items:center;padding:12px;animation:pop .2s both}
.mb{width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px;background:var(--sf);animation:pop .3s both}.mb h2{margin-top:0}
label{display:block;margin:9px 0;font-size:13px;color:var(--mu)}
input,textarea,select{width:100%;margin-top:4px;font:inherit;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid var(--gb);border-radius:12px;padding:10px 12px;outline:none}
input[type=range],input[type=checkbox]{padding:0;width:auto}input[type=range]{width:100%}input[type=color]{height:40px;padding:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:fb 2.6s ease-in-out infinite}@keyframes fb{50%{transform:translateY(-5px)}}
.empty{text-align:center;color:var(--mu);padding:36px}
.ed .mb{width:min(860px,100%);height:95vh;display:flex;flex-direction:column;gap:8px;animation:sl .35s cubic-bezier(.2,.9,.3,1) both}@keyframes sl{from{transform:translateY(50px);opacity:0}}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.top .row{margin:0;justify-content:flex-end}
.ti{font-size:21px;font-weight:700}.rt{margin:6px 0 0;font-size:clamp(26px,5vw,36px);line-height:1.2;-webkit-text-fill-color:var(--tx);background:none;animation:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two input,.two select{margin:0}
.tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-radius:14px;background:rgba(127,127,160,.2)}
.tb button{min-width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--gb);background:rgba(255,255,255,.1);color:var(--tx);cursor:pointer;transition:transform .12s}.tb button:active{transform:scale(.85)}.tb .sw{width:30px;min-width:30px;height:30px;align-self:center;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.nt{flex:1;min-height:180px;overflow:auto;outline:none;padding:18px 14px;border-radius:14px;background:rgba(127,127,160,.1);line-height:1.8;font-size:18px}
.nt>*{max-width:68ch;margin-left:auto;margin-right:auto}.nt p,.nt div{margin:0 0 .8em}.nt h2{font-size:1.5em;line-height:1.3;margin:1em auto .4em}.nt ul,.nt ol{padding-left:1.4em}.nt li{margin:.25em 0}
.nt img{max-width:100%;border-radius:12px;display:block;margin:10px auto;cursor:zoom-in}.nt u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--ac)}
.nt span[style*=background]{color:#111!important;border-radius:3px;padding:0 3px}
.lbx{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);overflow:auto;display:flex;cursor:zoom-in;animation:pop .2s both}.lbx img{margin:auto;max-width:100%;max-height:100vh}.lbx.z{cursor:zoom-out}.lbx.z img{max-width:none;max-height:none;width:230%}
.sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .5s}.sp.out{opacity:0;pointer-events:none}
.sp .lg{font-size:clamp(38px,12vw,84px);font-weight:800;display:flex;flex-wrap:wrap;justify-content:center}.sp span{animation:pop .6s calc(var(--i)*60ms) both;background:linear-gradient(var(--b1),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:110;padding:11px 18px;background:var(--sf);animation:pop .25s both}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.cf{position:fixed;z-index:120;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cf 1.4s cubic-bezier(.2,.7,.4,1) forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--rt));opacity:0}}
#pr{display:none}body.printing>*:not(#pr){display:none!important}body.printing{background:#fff!important;padding:0}
body.printing #pr{display:block;color:#000;background:#fff;font-family:Georgia,serif;padding:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .nt{overflow:visible;background:none;color:#000;padding:0}#pr .nt>*{max-width:none}#pr h1{background:none;color:#000;-webkit-text-fill-color:#000;font-size:26px;animation:none}#pr p{color:#444}
</style></head><body><div class="bg"><i style="width:45vmax;height:45vmax;top:-12%;left:-12%"></i><i style="width:40vmax;height:40vmax;bottom:-15%;right:-10%;animation-delay:-9s"></i></div><div id="app" class="wrap"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={nm:'Notatki+',ac:'#7c8cff',bg:'aurora',an:1,ft:'sys',th:'auto',r:24};
let S={st:{...DEF},ev:[],ok:0,err:0},tab='ev',flt='all',qv='',cur=null,isNew=false,dirty=0,lt=null,pw='',nz=18,st_,it,ss;
try{lt=localStorage.getItem('th');pw=sessionStorage.getItem('pw')||'';nz=+localStorage.getItem('nz')||18}catch(e){}
const ED=()=>!!pw;
// Ikony (SVG)
const IC={
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9.5 14.5 12 17l2.5-2.5"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
bold:'<path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/>',
italic:'<path d="M10 5h8M6 19h8M15 5l-6 14"/>',underline:'<path d="M7 4v7a5 5 0 0 0 10 0V4M5 20h14"/>',
strike:'<path d="M5 12h14M16 7a4 3 0 0 0-4-2c-2.5 0-4 1-4 2.5M8 17a4 3 0 0 0 4 2c2.5 0 4-1 4-2.5"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
olist:'<path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 14h3l-3 4h3"/>',
head:'<path d="M6 4v16M18 4v16M6 12h12"/>',para:'<path d="M13 4v16M17 4v16M13 4H9a4 4 0 0 0 0 8h4"/>',
eraser:'<path d="M4 20h16M7.5 16l-3-3a2 2 0 0 1 0-3L12 3.5a2 2 0 0 1 3 0L19.5 8a2 2 0 0 1 0 3L13 17.5z"/>',
nohl:'<circle cx="12" cy="12" r="8"/><path d="M6.3 6.3l11.4 11.4"/>',
zin:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>',zout:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
test:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
quiz:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
oral:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
event:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
note:'<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12M9 8h6"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const TY={test:['test','Sprawdzian','#ff5d73'],quiz:['quiz','Kartkówka','#ffb02e'],oral:['oral','Odpowiedź ustna','#2ee6c5'],event:['event','Wydarzenie','#a78bfa'],note:['note','Notatka','#7dd3fc']};
// Plan lekcji (tylko do podpowiadania lekcji po dacie)
const TM={1:'08:00 - 08:45',2:'08:50 - 09:35',3:'09:45 - 10:30',4:'10:40 - 11:25',5:'11:45 - 12:30',6:'12:50 - 13:35',7:'13:40 - 14:25',8:'14:30 - 15:15'};
const TT=[['Język polski','Język polski','Matematyka','Chemia','Geografia','Religia'],['Język polski','Fizyka','Język angielski','Historia','Biologia','Matematyka','Wychowanie fizyczne','Edukacja zdrowotna'],['Język angielski','Język polski','Matematyka','Matematyka','Wychowanie fizyczne','Informatyka'],['Matematyka','Fizyka','Język polski','Zajęcia dodatkowe - WF','Wiedza o społeczeństwie','Język niemiecki','Godzina wychowawcza'],['Historia','Język angielski','Język niemiecki','Zajęcia dodatkowe - WF','Edukacja dla bezpieczeństwa','Wiedza o społeczeństwie','Chemia']];
const today=()=>new Date().toLocaleDateString('sv'),dt=d=>new Date(d+'T12:00'),fmt=d=>d?dt(d).toLocaleDateString('pl-PL',{day:'numeric',month:'short'}):'',wd=d=>(dt(d).getDay()+6)%7;
const dd=d=>d?Math.round((dt(d)-dt(today()))/864e5):0,cd=n=>n<0?'minęło':n==0?'dziś':n==1?'jutro':'za '+n+' dni';
const lessonAt=(d,n)=>{const i=d?wd(d):9;return i<5&&n&&TT[i][n-1]?TT[i][n-1]:null};
const lopts=e=>{const i=e.d?wd(e.d):9;if(i>4)return '<option value="">Weekend – brak lekcji</option>';return '<option value="">Numer lekcji…</option>'+TT[i].map((s,k)=>`<option value="${k+1}" ${e.l==k+1?'selected':''}>${k+1}. ${esc(s)} (${TM[k+1].slice(0,5)})</option>`).join('')};
const clean=h=>{const d=new DOMParser().parseFromString('<body>'+h,'text/html');d.querySelectorAll('script,iframe,object,embed,link,style,meta').forEach(n=>n.remove());d.body.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))n.removeAttribute(a.name)}));return d.body.innerHTML};
// API
const logout=()=>{pw='';try{sessionStorage.removeItem('pw')}catch(e){}};
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json',...(pw?{'x-admin-password':pw}:{})}});if(r.status==401&&o.method&&o.method!='GET'){logout();render();throw 401}if(!r.ok)throw r.status;return r.json()}
async function load(soft){try{const[s,e]=await Promise.all([api('settings'),api('notes')]);S.st={...DEF,...s};S.ev=e;S.ok=1;S.err=0}catch(x){if(!S.ok)S.err=1}
if(soft&&$('#lst')){ap();$('#lst').innerHTML=list()}else render(1)}
function ap(){const s=S.st,r=document.documentElement;r.style.setProperty('--ac',s.ac);r.style.setProperty('--r',(s.r??24)+'px');r.dataset.bg=s.bg;r.dataset.an=s.an?1:0;r.dataset.ft=s.ft;let t=lt||s.th;if(t=='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';r.dataset.theme=t}
function toast(t){const e=document.createElement('div');e.className='g toast';e.textContent=t;$('#ov').append(e);setTimeout(()=>e.remove(),2800)}
function modal(h,c=''){const m=document.createElement('div');m.className='m '+c;m.innerHTML='<div class="g mb">'+h+'</div>';m.onclick=e=>{if(e.target==m&&!c)m.remove()};$('#ov').append(m);return m}
const closeM=()=>{const m=document.querySelectorAll('.m');m[m.length-1]?.remove()};
const card=e=>{const t=TY[e.ty]||TY.note,d=dd(e.d);return `<article class="g ev ${e.d&&d<0&&e.ty!='note'?'past':''}" data-a="open" data-id="${e.id}" style="--c:${t[2]}"><div class="ic">${ic(t[0])}</div><div><div class="mt">${t[1]}${e.s?' · '+esc(e.s):''}${e.l?' · lekcja '+e.l:''}</div><h3>${e.pin?ic('star','f'):''}${esc(e.ti||e.s||'Bez tytułu')}</h3><div class="mt">${e.d?fmt(e.d)+(e.ty!='note'?' · '+cd(d):''):''}${e.im?' · '+e.im+' zdj.':''}</div></div></article>`};
function list(){if(!S.ok)return '<div class="empty g">Ładowanie…</div>';const q=qv.toLowerCase();return S.ev.filter(e=>(flt=='all'||e.ty==flt)&&(!q||(e.ti+' '+e.s+' '+(e.tx||'')).toLowerCase().includes(q))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(dd(a.d)<0)-(dd(b.d)<0)||(a.d<b.d?-1:1)).map(card).join('')||'<div class="empty g">Nic tu jeszcze nie ma</div>'}
function notes(){return `<div class="sr">${ic('search')}<input id="q" placeholder="Szukaj w notatkach…" value="${esc(qv)}"></div><div class="chips" style="margin-bottom:12px"><button class="chip ${flt=='all'?'on':''}" data-a="flt" data-k="all">Wszystko</button>${Object.entries(TY).map(([k,t])=>`<button class="chip ${flt==k?'on':''}" data-a="flt" data-k="${k}">${ic(t[0])}${t[1]}</button>`).join('')}</div><div id="lst">${list()}</div>`}
function render(an){ap();const a=$('#app');a.className='wrap'+(an?' in':'');const dk=document.documentElement.dataset.theme=='dark';
a.innerHTML=`<header><div><h1>${esc(S.st.nm)}</h1><p class="sub">Sprawdziany, kartkówki i notatki</p></div><div class="row" style="margin:0"><button class="btn ib" data-a="th" aria-label="Zmień motyw">${ic(dk?'sun':'moon')}</button>${ED()?`<button class="btn ib" data-a="set" aria-label="Wygląd">${ic('sliders')}</button><button class="btn ib" data-a="out" aria-label="Wyloguj">${ic('unlock')}</button>`:`<button class="btn ib" data-a="login" aria-label="Panel admina">${ic('lock')}</button>`}</div></header><div style="height:16px"></div>${S.err?'<div class="empty g">Nie można połączyć z serwerem. Odśwież stronę.</div>':notes()}${ED()?`<button class="btn pr fab" data-a="new">${ic('plus')}<span>Nowa notatka</span></button>`:''}`}
// Zapis
const setStat=t=>{const e=$('#sv');if(e)e.textContent=t};
const sched=()=>{dirty=1;clearTimeout(st_);st_=setTimeout(put,800);setStat('Zapisywanie…')};
async function put(){if(!cur||!dirty||!ED())return;const e=cur;if(!e.ti&&!(e.tx||'').trim()&&!/<img/.test(e.h)&&!e.s){dirty=0;return}dirty=0;setStat('Zapisywanie…');
try{await api('notes/'+e.id,{method:'PUT',body:JSON.stringify(e)});const m={id:e.id,ty:e.ty,s:e.s,l:e.l,d:e.d,ti:e.ti,pin:e.pin,tx:(e.tx||'').slice(0,3000),im:(e.h.match(/<img/g)||[]).length},i=S.ev.findIndex(x=>x.id==e.id);i<0?S.ev.push(m):S.ev[i]=m;setStat('Zapisano')}catch(x){dirty=1;setStat('Błąd zapisu');if(x==413)toast('Notatka jest za duża – usuń część zdjęć')}}
const wc=()=>{const h=$('#e-h'),w=$('#wc');if(h&&w)w.textContent=(h.innerText.trim().match(/\S+/g)||[]).length+' słów'};

async function jpg(){flush();const e=cur,t=TY[e.ty]||TY.note,W=800,box=document.createElement('div');

function conf(){if(!S.st.an)return;const cs=['#ff5d73','#ffb02e','#2ee6c5','#a78bfa','#7dd3fc','#fff176'];for(let i=0;i<30;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:50%;top:65%;background:${cs[i%6]};--x:${(Math.random()-.5)*380}px;--y:${-120-Math.random()*280}px;--rt:${Math.random()*720}deg`;document.body.append(c);setTimeout(()=>c.remove(),1500)}}
